<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B1220">
<title>Preparing your file…</title>
<style>
:root{
  --bg:#0B1220; --bg2:#101A2E; --card:#111C30; --line:#22324D; --ink:#EAF1FB; --mute:#8FA2BF;
  --blue:#2AABEE; --blue2:#6C8BFF; --ok:#3DDC97; --err:#FF7A7A; --track:#1B2A44;
}
@media (prefers-color-scheme:light){
  :root{ --bg:#EEF3FA; --bg2:#E2EAF6; --card:#FFFFFF; --line:#D3DEEE; --ink:#0F1B2D; --mute:#5A6E8A; --blue:#1E96D8; --blue2:#4F6DF0; --ok:#12A468; --err:#C73636; --track:#E3ECF8; }
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  background:radial-gradient(900px 500px at 15% -10%,color-mix(in srgb,var(--blue2) 22%,transparent),transparent 60%),
             radial-gradient(800px 500px at 100% 110%,color-mix(in srgb,var(--blue) 20%,transparent),transparent 60%),var(--bg);
  color:var(--ink); font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;
}
header,footer{width:100%; max-width:980px; margin:0 auto; padding:18px 20px; display:flex; align-items:center; justify-content:space-between}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px}
.logo{width:32px; height:32px; border-radius:10px; background:linear-gradient(135deg,var(--blue),var(--blue2)); display:grid; place-items:center}
.logo svg{width:18px; height:18px; fill:#fff}
.sound{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); color:var(--ink);
  padding:8px 12px; border-radius:999px; font:inherit; font-size:14px; cursor:pointer}
.sound svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.sound:focus-visible,.btn:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
main{flex:1; display:grid; place-items:center; padding:12px 20px 28px}
.card{
  width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:24px;
  padding:34px 26px 26px; text-align:center; box-shadow:0 30px 80px -30px rgba(0,0,0,.55);
}
.timer{position:relative; width:180px; height:180px; margin:0 auto 22px}
.timer svg.ring{width:180px; height:180px; transform:rotate(-90deg)}
.timer .track{stroke:var(--track)}
.timer .bar{stroke:url(#g); stroke-linecap:round; stroke-dasharray:540; stroke-dashoffset:540}
.timer.run .bar{animation:fill var(--d,5s) linear forwards}
@keyframes fill{to{stroke-dashoffset:0}}
.timer .glow{position:absolute; inset:14px; border-radius:50%; background:radial-gradient(circle,color-mix(in srgb,var(--blue) 30%,transparent),transparent 70%); opacity:.0}
.timer.tick .glow{animation:glow .9s ease-out}
@keyframes glow{0%{opacity:.9; transform:scale(.8)}100%{opacity:0; transform:scale(1.25)}}
.num{position:absolute; inset:0; display:grid; place-items:center; font-size:76px; font-weight:800; font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--blue),var(--blue2)); -webkit-background-clip:text; background-clip:text; color:transparent}
.num.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(1.5); opacity:0}60%{opacity:1}100%{transform:scale(1)}}
.plane{position:absolute; inset:0; margin:auto; width:64px; height:64px; fill:var(--blue); display:none}
.timer.done .num{display:none}
.timer.done .plane{display:block; animation:fly .8s ease-out}
@keyframes fly{0%{transform:translate(-30px,30px) scale(.6); opacity:0}100%{transform:none; opacity:1}}
h1{font-size:24px; line-height:1.25; margin:0 0 8px}
.sub{margin:0 0 22px; color:var(--mute); font-size:15px}
.sub b{color:var(--ink)}
.steps{list-style:none; margin:0 0 24px; padding:0; text-align:left; display:grid; gap:10px}
.steps li{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:14px; color:var(--mute); font-size:14.5px; transition:.3s}
.steps li i{width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex:none; display:grid; place-items:center; transition:.3s}
.steps li i svg{width:12px; height:12px; stroke:#06210F; stroke-width:3; fill:none; opacity:0; stroke-linecap:round; stroke-linejoin:round}
.steps li.on{color:var(--ink); border-color:color-mix(in srgb,var(--blue) 55%,var(--line))}
.steps li.on i{border-color:var(--blue); animation:spin 1s linear infinite; border-top-color:transparent}
.steps li.ok{color:var(--ink)}
.steps li.ok i{background:var(--ok); border-color:var(--ok); animation:none}
.steps li.ok i svg{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:block; width:100%; padding:15px 16px; border:0; border-radius:14px; cursor:pointer; text-decoration:none; font:inherit; font-weight:700;
  background:linear-gradient(135deg,var(--blue),var(--blue2)); color:#fff; transition:transform .15s, filter .15s}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.98)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); margin-top:10px; font-weight:600}
.note{margin:16px 0 0; font-size:12.5px; color:var(--mute)}
.err .timer,.err .steps,.err #copy{display:none}
.err h1{color:var(--err)}
footer{font-size:13px; color:var(--mute); justify-content:center; gap:6px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01s!important} }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M21.9 3.3 2.7 10.7c-1 .4-1 1.3-.2 1.6l4.9 1.5 1.9 5.8c.2.6.4.8.9.8s.7-.2 1-.5l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.7-.8l3-14.3c.3-1.2-.4-1.8-1.3-1.5Z"/></svg></span><span id="brand">FileLink</span></div>
  <button class="sound" id="sound" type="button" aria-pressed="true">
    <svg id="sOn" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg id="sOff" viewBox="0 0 24 24" hidden><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
    <span id="sText">Sound on</span>
  </button>
</header>

<main>
  <section class="card" id="view" aria-live="polite">
    <div class="timer" id="timer">
      <svg class="ring" viewBox="0 0 180 180" fill="none" stroke-width="8">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2AABEE"/><stop offset="1" stop-color="#6C8BFF"/></linearGradient></defs>
        <circle class="track" cx="90" cy="90" r="86"/>
        <circle class="bar" cx="90" cy="90" r="86"/>
      </svg>
      <div class="glow"></div>
      <div class="num" id="num">5</div>
      <svg class="plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 3.3 2.7 10.7c-1 .4-1 1.3-.2 1.6l4.9 1.5 1.9 5.8c.2.6.4.8.9.8s.7-.2 1-.5l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.7-.8l3-14.3c.3-1.2-.4-1.8-1.3-1.5Z"/></svg>
    </div>

    <h1 id="title">Preparing your file…</h1>
    <p class="sub" id="sub">You'll be taken to <b id="botname"></b> on Telegram in a moment.</p>

    <ul class="steps" id="steps">
      <li id="s1"><i><svg viewBox="0 0 12 12"><path d="m2 6.5 2.5 2.5L10 3.5"/></svg></i>Verifying secure link</li>
      <li id="s2"><i><svg viewBox="0 0 12 12"><path d="m2 6.5 2.5 2.5L10 3.5"/></svg></i>Locating your file</li>
      <li id="s3"><i><svg viewBox="0 0 12 12"><path d="m2 6.5 2.5 2.5L10 3.5"/></svg></i>Opening Telegram</li>
    </ul>

    <a class="btn" id="open" href="#">Open in Telegram now</a>
    <button class="btn ghost" id="copy" type="button">Copy link</button>
    <p class="note" id="hint" hidden>Tap anywhere on the screen to turn the sound on.</p>
    <p class="note" id="note">Telegram didn't open? Tap the button above.</p>
  </section>
</main>

<footer><span>Secure redirect</span><span>·</span><span>No data is stored</span></footer>

<script>
(function () {
  "use strict";

  /* ============ CONFIG ============ */
  var CONFIG = {
    BRAND: "FileLink",       // site name shown at the top
    DEFAULT_BOT: "",         // e.g. "MyFileStoreBot" (no @). Empty = bot name required in the link
    ALLOWED_BOTS: [],        // e.g. ["MyFileStoreBot"]. Empty = any bot allowed
    DELAY_SECONDS: 5,        // countdown length (5 -> 0). 0 = instant redirect
    PAYLOAD_PARAM: "start",  // "start" or "startgroup"
    SOUND: true              // tick sound on by default
  };
  /* ================================== */

  var BOT_RE = /^[A-Za-z][A-Za-z0-9_]{4,31}$/;
  var PAYLOAD_RE = /^[A-Za-z0-9_-]{1,64}$/;
  var $ = function (id) { return document.getElementById(id); };
  var view = $("view"), timer = $("timer"), num = $("num");
  $("brand").textContent = CONFIG.BRAND;

  /* ---------- parse link ---------- */
  var q = new URLSearchParams(location.search);
  var parts = location.pathname.split("/").filter(Boolean);
  var bot = q.get("bot"), payload = q.get("start");
  if (!bot && !payload) {
    if (parts.length >= 2) { bot = parts[0]; payload = parts[1]; }
    else if (parts.length === 1) { payload = parts[0]; }
  }
  bot = (bot || CONFIG.DEFAULT_BOT || "").replace(/^@/, "");
  payload = payload || "";

  function fail(text) {
    view.classList.add("err");
    $("title").textContent = "This link isn't valid";
    $("sub").textContent = text;
    $("open").hidden = true; $("note").hidden = true;
    document.title = "Invalid link";
  }
  if (!BOT_RE.test(bot)) return fail("The bot name is missing or incorrect. Ask whoever sent it for a new link.");
  if (!PAYLOAD_RE.test(payload)) return fail("The file code is invalid or the link was cut off.");
  if (CONFIG.ALLOWED_BOTS.length && !CONFIG.ALLOWED_BOTS.some(function (b) { return b.toLowerCase() === bot.toLowerCase(); }))
    return fail("This bot isn't allowed on this site.");

  var web = "https://t.me/" + bot + "?" + CONFIG.PAYLOAD_PARAM + "=" + payload;
  var app = "tg://resolve?domain=" + bot + "&" + CONFIG.PAYLOAD_PARAM + "=" + payload;
  $("botname").textContent = "@" + bot;
  $("open").href = web;

  /* ---------- sound (Web Audio, no files) ---------- */
  var soundOn = CONFIG.SOUND, ctx = null;
  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    return ctx;
  }
  function beep(freq, dur, type, vol, when) {
    var c = audio(); if (!c || !soundOn || c.state !== "running") return;
    var t = c.currentTime + (when || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  var flip = false;
  function click(vol, hp, thump) {
    var c = audio(); if (!c || !soundOn || c.state !== "running") return;
    var t = c.currentTime, len = Math.floor(c.sampleRate * 0.06);
    var buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    var n = c.createBufferSource(); n.buffer = buf;
    var f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = hp; f.Q.value = 1.2;
    var g = c.createGain(); g.gain.value = vol;
    n.connect(f); f.connect(g); g.connect(c.destination); n.start(t);
    var o = c.createOscillator(), og = c.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(thump, t); o.frequency.exponentialRampToValueAtTime(thump * 0.6, t + 0.08);
    og.gain.setValueAtTime(vol * 0.9, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    o.connect(og); og.connect(c.destination); o.start(t); o.stop(t + 0.1);
  }
  function tickSound() { flip = !flip; flip ? click(1.6, 2600, 320) : click(1.4, 1800, 230); }
  function doneSound() { beep(660, 0.16, "sine", 0.4); beep(990, 0.26, "sine", 0.4, 0.14); }

  function unlock() {
    var c = audio();
    if (c && c.state === "suspended") {
      c.resume().then(function () { $("hint").hidden = true; }, function () {});
    }
  }
  setTimeout(function () { if (soundOn && ctx && ctx.state !== "running") $("hint").hidden = false; }, 300);
  ["pointerdown", "keydown", "touchstart"].forEach(function (ev) {
    window.addEventListener(ev, unlock, { passive: true });
  });
  unlock();

  var sBtn = $("sound");
  function paintSound() {
    $("sOn").hidden = !soundOn; $("sOff").hidden = soundOn;
    $("sText").textContent = soundOn ? "Sound on" : "Sound off";
    sBtn.setAttribute("aria-pressed", String(soundOn));
  }
  sBtn.addEventListener("click", function () { soundOn = !soundOn; unlock(); paintSound(); if (soundOn) tickSound(); });
  paintSound();

  /* ---------- launch Telegram ---------- */
  var launched = false;
  function launch() {
    if (launched) return; launched = true;
    var left = false;
    var onHide = function () { if (document.hidden) left = true; };
    document.addEventListener("visibilitychange", onHide);
    location.href = app;                      // try the Telegram app first
    setTimeout(function () {
      document.removeEventListener("visibilitychange", onHide);
      if (!left) location.replace(web);       // fall back to t.me
    }, 1400);
  }
  $("open").addEventListener("click", function (e) { e.preventDefault(); launched = false; launch(); });

  $("copy").addEventListener("click", function () {
    var b = this, say = function (t) { b.textContent = t; setTimeout(function () { b.textContent = "Copy link"; }, 1800); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(web).then(function () { say("Copied!"); }, function () { say("Copy failed"); });
    else say("Copy failed");
  });

  /* ---------- countdown ---------- */
  var total = Math.max(0, CONFIG.DELAY_SECONDS | 0);
  if (total === 0) { launch(); return; }

  var steps = [$("s1"), $("s2"), $("s3")];
  function setStep(n) {          // n = index that is "in progress"; earlier ones are done
    steps.forEach(function (li, i) {
      li.classList.toggle("ok", i < n);
      li.classList.toggle("on", i === n);
    });
  }
  function stepFor(left) {       // map remaining seconds to a step
    var p = (total - left) / total;
    return p < 0.34 ? 0 : p < 0.67 ? 1 : 2;
  }

  var left = total;
  timer.style.setProperty("--d", total + "s");
  timer.classList.add("run");
  function show(n) {
    num.textContent = n;
    num.classList.remove("pop"); void num.offsetWidth; num.classList.add("pop");
    timer.classList.remove("tick"); void timer.offsetWidth; timer.classList.add("tick");
  }
  show(left); setStep(stepFor(left)); tickSound();

  var iv = setInterval(function () {
    left -= 1;
    if (left > 0) { show(left); setStep(stepFor(left)); tickSound(); return; }
    clearInterval(iv);
    show(0); tickSound();
    setTimeout(function () {
      steps.forEach(function (li) { li.classList.remove("on"); li.classList.add("ok"); });
      timer.classList.add("done");
      $("title").textContent = "Opening Telegram…";
      doneSound();
      launch();
    }, 450);
  }, 1000);
})();
</script>
</body>
</html>
